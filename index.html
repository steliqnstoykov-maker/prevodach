<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1220;color:#f1f5f9}
.app{max-width:760px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}

<script>
// [речев код, име, знаме] - първите пет са по избран ред
const LANGS=[
["en-US","English","🇬🇧"],["bg-BG","Български","🇧🇬"],["ru-RU","Русский","🇷🇺"],["uk-UA","Українська","🇺🇦"],["tr-TR","Türkçe","🇹🇷"],
["af-ZA","Afrikaans","🇿🇦"],["sq-AL","Shqip","🇦🇱"],["ar-SA","العربية","🇸🇦"],["hy-AM","Հայերեն","🇦🇲"],["az-AZ","Azərbaycan","🇦🇿"],
["be-BY","Беларуская","🇧🇾"],["bn-BD","বাংলা","🇧🇩"],["bs-BA","Bosanski","🇧🇦"],["ca-ES","Català","🇪🇸"],["zh-CN","中文","🇨🇳"],
["hr-HR","Hrvatski","🇭🇷"],["cs-CZ","Čeština","🇨🇿"],["da-DK","Dansk","🇩🇰"],["nl-NL","Nederlands","🇳🇱"],["et-EE","Eesti","🇪🇪"],
["tl-PH","Filipino","🇵🇭"],["fi-FI","Suomi","🇫🇮"],["fr-FR","Français","🇫🇷"],["ka-GE","ქართული","🇬🇪"],["de-DE","Deutsch","🇩🇪"],
["el-GR","Ελληνικά","🇬🇷"],["he-IL","עברית","🇮🇱"],["hi-IN","हिन्दी","🇮🇳"],["hu-HU","Magyar","🇭🇺"],["is-IS","Íslenska","🇮🇸"],
["id-ID","Indonesia","🇮🇩"],["ga-IE","Gaeilge","🇮🇪"],["it-IT","Italiano","🇮🇹"],["ja-JP","日本語","🇯🇵"],["kk-KZ","Қазақша","🇰🇿"],
["ko-KR","한국어","🇰🇷"],["lv-LV","Latviešu","🇱🇻"],["lt-LT","Lietuvių","🇱🇹"],["mk-MK","Македонски","🇲🇰"],["ms-MY","Melayu","🇲🇾"],
["mt-MT","Malti","🇲🇹"],["mn-MN","Монгол","🇲🇳"],["no-NO","Norsk","🇳🇴"],["fa-IR","فارسی","🇮🇷"],["pl-PL","Polski","🇵🇱"],
["pt-PT","Português","🇵🇹"],["ro-RO","Română","🇷🇴"],["sr-RS","Српски","🇷🇸"],["sk-SK","Slovenčina","🇸🇰"],["sl-SI","Slovenščina","🇸🇮"],
["es-ES","Español","🇪🇸"],["sw-KE","Kiswahili","🇰🇪"],["sv-SE","Svenska","🇸🇪"],["th-TH","ไทย","🇹🇭"],["ur-PK","اردو","🇵🇰"],
["uz-UZ","Oʻzbek","🇺🇿"],["vi-VN","Tiếng Việt","🇻🇳"]
];
const $=id=>document.getElementById(id);
const SEL={A:$("A"),B:$("B")};
LANGS.forEach((l,i)=>{for(const w of ["A","B"]){const o=document.createElement("option");o.value=i;o.textContent=l[2]+"  "+l[1];SEL[w].appendChild(o)}});
SEL.A.value=localStorage.getItem("A")||1; SEL.B.value=localStorage.getItem("B")||0;
const other=w=>w==="A"?"B":"A";
const api=c=>c.startsWith("zh")?c:c.split("-")[0];
const live=t=>$("live").textContent=t;

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,running=false,busy=false,cur="A",tok=0,frames=[],checked=false,calibrating=false;
let prof=JSON.parse(localStorage.getItem("prof")||"{}");
let stream,ctx,an,td,fd,msrc,commitTimer,pending="",lastAct=0;
let proc=null,smartRun=false,sbusy=false,speaking=false,ring=[],chunks=[],lastVoice=0,startT=0,voicedMs=0,nf=0.005;

function refreshCal(){
  for(const w of ["A","B"])$("c"+w).textContent=(prof[w]?"✅":"🎙")+" Глас "+w+" "+LANGS[SEL[w].value][2];
  $("wA").innerHTML='<span class="fl">'+LANGS[SEL.A.value][2]+'</span>'+LANGS[SEL.A.value][1];
  $("wB").innerHTML='<span class="fl">'+LANGS[SEL.B.value][2]+'</span>'+LANGS[SEL.B.value][1];
  $("sA").textContent=LANGS[SEL.A.value][2]+" ➜ "+LANGS[SEL.B.value][2];
  $("sB").textContent=LANGS[SEL.B.value][2]+" ➜ "+LANGS[SEL.A.value][2];
  $("auto").disabled=!(prof.A&&prof.B);
  if($("auto").disabled)$("auto").checked=false;
}
function langChanged(){localStorage.setItem("A",SEL.A.value);localStorage.setItem("B",SEL.B.value);refreshCal()}
SEL.A.onchange=SEL.B.onchange=langChanged;
$("swap").onclick=()=>{[SEL.A.value,SEL.B.value]=[SEL.B.value,SEL.A.value];
  const p=prof.A;prof.A=prof.B;prof.B=p;localStorage.setItem("prof",JSON.stringify(prof));langChanged()};
$("clr").onclick=()=>{$("log").innerHTML=""};

// ---------- Микрофон и отпечатък на гласа ----------
async function initMic(){
  if(stream){ctx.resume();return true}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.resume)ctx.resume();
    msrc=ctx.createMediaStreamSource(stream);
    an=ctx.createAnalyser();an.fftSize=2048;msrc.connect(an);
    td=new Float32Array(an.fftSize);fd=new Float32Array(an.frequencyBinCount);
    setInterval(sample,50);
    return true;
  }catch(e){alert("Няма достъп до микрофона. Разреши го от иконата до адреса.");return false}
}
function pitch(buf,sr){
  const n=buf.length,minLag=Math.floor(sr/400),maxLag=Math.floor(sr/70);
  let e0=0;for(let i=0;i<n;i++)e0+=buf[i]*buf[i];
  if(e0<1e-6)return 0;
  let best=0,bl=0;
  for(let lag=minLag;lag<=maxLag;lag++){
    let s=0;for(let i=0;i<n-lag;i++)s+=buf[i]*buf[i+lag];
    if(s>best){best=s;bl=lag}
  }
  return(bl&&best/e0>0.3)?sr/bl:0;
}
const NB=24;
function bands(fd,sr){
  const hz=sr/an.fftSize,out=[];
  for(let i=0;i<NB;i++){
    const lo=Math.max(1,Math.floor(100*Math.pow(40,i/NB)/hz));
    const hi=Math.max(lo+1,Math.floor(100*Math.pow(40,(i+1)/NB)/hz));
    let s=0,c=0;
    for(let k=lo;k<hi&&k<fd.length;k++){s+=isFinite(fd[k])?fd[k]:-140;c++}
    out.push(c?s/c:-140);
  }
  const m=out.reduce((a,b)=>a+b,0)/NB;
  return out.map(x=>x-m);
}
function sample(){
  if(!an||busy)return;
  an.getFloatTimeDomainData(td);
  let e=0;for(let i=0;i<td.length;i++)e+=td[i]*td[i];
  if(Math.sqrt(e/td.length)<0.012)return;
  an.getFloatFrequencyData(fd);
  frames.push({p:pitch(td,ctx.sampleRate),b:bands(fd,ctx.sampleRate)});
  if(frames.length>400)frames.shift();
}
function summarize(fr){
  if(fr.length<10)return null;
  const ps=fr.map(f=>f.p).filter(p=>p>0).sort((a,b)=>a-b);
  const p=ps.length>=5?ps[Math.floor(ps.length/2)]:0;
  const b=new Array(NB).fill(0);
  fr.forEach(f=>f.b.forEach((v,i)=>b[i]+=v/fr.length));
  return{p,b};
}
function dist(s,r){
  let d=0;for(let i=0;i<NB;i++)d+=(s.b[i]-r.b[i])**2;
  d=Math.sqrt(d/NB);
  const pd=(s.p&&r.p)?Math.abs(12*Math.log2(s.p/r.p)):4;
  return d/3+pd/4;
}
function classify(fr){
  const s=summarize(fr);
  if(!s||!prof.A||!prof.B)return null;
  const a=dist(s,prof.A),b=dist(s,prof.B);
  return{who:a<b?"A":"B",margin:Math.abs(a-b)/(a+b+1e-6)};
}
async function calibrate(w){
  if(running){alert("Първо спри разговора.");return}
  if(calibrating||!(await initMic()))return;
  calibrating=true;frames=[];let t=6;
  const btn=$("c"+w);btn.textContent="🎙 Говори... "+t+"с";
  const timer=setInterval(()=>{
    btn.textContent="🎙 Говори... "+(--t)+"с";
    if(t<=0){
      clearInterval(timer);calibrating=false;
      const s=summarize(frames);
      if(!s||frames.length<30)alert("Не чух достатъчно глас. Опитай пак по-близо до микрофона.");
      else{prof[w]=s;localStorage.setItem("prof",JSON.stringify(prof))}
      frames=[];refreshCal();
    }
  },1000);
}
$("cA").onclick=()=>calibrate("A");
$("cB").onclick=()=>calibrate("B");

// ---------- Превод ----------
async function gt(text,f,t){
  const u="https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+api(f)+"&tl="+api(t)+"&q="+encodeURIComponent(text);
  const r=await fetch(u);if(!r.ok)throw new Error("gt");
  const j=await r.json();return j[0].map(x=>x[0]).join("");
}
async function mm(text,f,t){
  const u="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+api(f)+"|"+api(t);
  const j=await(await fetch(u)).json();
  const s=j.responseData.translatedText;
  if(/MYMEMORY WARNING/i.test(s))throw new Error("mm");
  return s;
}
async function translate(text,f,t){
  try{return await gt(text,f,t)}catch(_){return await mm(text,f,t)}
}
function speak(text,lang){
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=parseFloat($("rate").value);
    const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").toLowerCase().startsWith(lang.split("-")[0].toLowerCase()));
    if(v)u.voice=v;
    u.onend=u.onerror=()=>res();
    speechSynthesis.cancel();speechSynthesis.speak(u);
    setTimeout(res,25000);
  });
}
function addMsg(w,orig,tr,f,t){
  saveHist(w,orig,tr,f,t);
  const d=document.createElement("div");d.className="msg "+w;
  d.innerHTML='<div class="o"></div><div class="t"></div><button class="re">🔊 Повтори</button><button class="re cp">📋 Копирай</button>';
  d.children[0].textContent="Говорител "+w+" · "+f[2]+" "+orig;
  d.children[1].textContent=t[2]+" "+tr;
  d.children[2].onclick=()=>speak(tr,t[0]);
  d.children[3].onclick=()=>{try{navigator.clipboard.writeText(tr)}catch(_){}};
  $("log").appendChild(d);$("log").scrollTop=1e9;
}

// ---------- Слушане (безплатен режим) ----------
const pauseMs=()=>parseFloat($("pause").value)*1000;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function collect(rs){
  const out=[];
  for(let i=0;i<rs.length;i++){
    const t=rs[i][0].transcript.trim();
    if(!t)continue;
    if(out.length&&t.toLowerCase().startsWith(out[out.length-1].toLowerCase()))out[out.length-1]=t;
    else out.push(t);
  }
  return out.join(" ");
}
function dedupe(t){
  const w=t.trim().split(/\s+/);
  if(w.length>=2&&w.length%2===0&&w.length<=12){
    const h=w.length/2;
    if(w.slice(0,h).join(" ").toLowerCase()===w.slice(h).join(" ").toLowerCase())return w.slice(0,h).join(" ");
  }
  return t.trim();
}
function startRec(w){
  if(!running)return;
  clearInterval(commitTimer);
  cur=w;frames=[];checked=false;pending="";lastAct=0;
  const lang=LANGS[SEL[w].value];
  const my=++tok;
  $("wA").classList.toggle("act",w==="A");$("wB").classList.toggle("act",w==="B");
  live("🎤 Слушам "+lang[2]+" "+lang[1]+"...");
  rec=new SR();rec.lang=lang[0];rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    if(my!==tok||busy)return;
    const t=collect(e.results);
    if(!t)return;
    if(t!==pending){pending=t;lastAct=Date.now()}
    live(lang[2]+" "+t);
    // Проверка кой говори (само веднъж на изказване)
    if(!checked&&$("auto").checked&&frames.length>=12){
      checked=true;
      const c=classify(frames);
      if(c&&c.who!==cur&&c.margin>=0.08){
        live("🧠 Говори другият човек, сменям езика...");
        clearInterval(commitTimer);tok++;try{rec.abort()}catch(_){}
        setTimeout(()=>startRec(c.who),150);
        return;
      }
    }
  };
  rec.onend=()=>{
    if(my!==tok)return;
    if(pending&&!busy){const t=pending;pending="";clearInterval(commitTimer);handle(t,cur);return}
    if(running&&!busy)setTimeout(()=>startRec(cur),200);
  };
  rec.onerror=e=>{
    if(my!==tok)return;
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      stop();
      live("⛔ Няма достъп до гласово разпознаване. На iPhone: отвори сайта в Safari (не от иконата) и включи Настройки › Общи › Клавиатура › Диктовка. Или ползвай 🤖 Умен режим.");
    }else if(e.error==="audio-capture"){stop();live("⛔ Не намирам микрофон.")}
    else if(e.error==="language-not-supported"){stop();live("⛔ Този език не се поддържа за говор на това устройство.")}
    else if(e.error==="network"){live("⚠️ Няма връзка за разпознаване на реч.")}
  };
  // превежда чак когато човекът е млъкнал за зададената пауза
  commitTimer=setInterval(()=>{
    if(my!==tok||busy||!pending)return;
    if(Date.now()-lastAct>pauseMs()){const t=pending;pending="";clearInterval(commitTimer);handle(t,cur)}
  },200);
  try{rec.start()}catch(_){}
}
async function handle(text,spk){
  text=dedupe(text);
  busy=true;tok++;clearInterval(commitTimer);try{rec.abort()}catch(_){}
  const f=LANGS[SEL[spk].value],t=LANGS[SEL[other(spk)].value];
  live("⏳ Превеждам...");
  try{
    const tr=await translate(text,f[0],t[0]);
    addMsg(spk,text,tr,f,t);
    live("🔊");
    await speak(tr,t[0]);
  }catch(e){live("Грешка при превода (проверете интернет).")}
  busy=false;live("");
  const nxt=($("auto").checked||$("alt").checked)?other(spk):spk;
  if(running)startRec(nxt);
}

function stop(){
  running=false;smartRun=false;tok++;clearInterval(commitTimer);
  try{rec.abort()}catch(_){}
  if(proc){try{msrc.disconnect(proc);proc.disconnect()}catch(_){}proc=null}
  speechSynthesis.cancel();busy=false;sbusy=false;speaking=false;ring=[];chunks=[];
  $("go").textContent="🎤";$("go").classList.remove("on");live("");
  $("wA").classList.remove("act");$("wB").classList.remove("act");
}

// ---------- Умен режим: автоматичен език чрез OpenAI Whisper ----------
function askKey(){
  const k=prompt("Постави своя OpenAI ключ (започва с sk-). Той остава само в този браузър.");
  if(k&&k.trim().startsWith("sk-")){localStorage.setItem("oaikey",k.trim());return true}
  return false;
}
$("key").onclick=askKey;
$("smart").onchange=()=>{if($("smart").checked&&!localStorage.getItem("oaikey")&&!askKey())$("smart").checked=false};

function toWav(chs,sr){
  let n=0;chs.forEach(c=>n+=c.length);
  const all=new Float32Array(n);let o=0;chs.forEach(c=>{all.set(c,o);o+=c.length});
  let pk=0;for(let i=0;i<n;i++){const a=Math.abs(all[i]);if(a>pk)pk=a}
  const g=pk>0?Math.min(8,0.9/pk):1;
  const r=sr/16000,m=Math.floor(n/r),buf=new ArrayBuffer(44+m*2),v=new DataView(buf);
  const w=(p,t)=>{for(let i=0;i<t.length;i++)v.setUint8(p+i,t.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+m*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,m*2,true);
  for(let i=0;i<m;i++){
    const a=Math.floor(i*r),b=Math.max(a+1,Math.min(n,Math.floor((i+1)*r)));
    let t=0;for(let k=a;k<b;k++)t+=all[k];
    t=Math.max(-1,Math.min(1,(t/(b-a))*g));
    v.setInt16(44+i*2,t*32767,true);
  }
  return new Blob([buf],{type:"audio/wav"});
}
async function whisper(blob){
  const fd=new FormData();
  fd.append("file",blob,"a.wav");fd.append("model","whisper-1");fd.append("response_format","verbose_json");
  const r=await fetch("https://api.openai.com/v1/audio/transcriptions",{method:"POST",headers:{Authorization:"Bearer "+localStorage.getItem("oaikey")},body:fd});
  if(!r.ok)throw new Error(String(r.status));
  return r.json();
}
function langOf(name){
  name=(name||"").toLowerCase();if(!name)return null;
  let dn;try{dn=new Intl.DisplayNames(["en"],{type:"language"})}catch(_){return null}
  for(const w of ["A","B"]){
    try{let n=dn.of(api(LANGS[SEL[w].value][0])).toLowerCase();if(n==="filipino")n="tagalog";if(n.startsWith(name))return w}catch(_){}
  }
  return null;
}
function onAudio(e){
  if(!smartRun||sbusy)return;
  const c=new Float32Array(e.inputBuffer.getChannelData(0));
  let q=0;for(let i=0;i<c.length;i++)q+=c[i]*c[i];
  const rms=Math.sqrt(q/c.length),now=Date.now();
  const thr=Math.max(0.010,nf*2.5),voiced=rms>thr;
  if(!speaking){
    if(!voiced)nf=Math.min(0.05,nf*0.97+rms*0.03);
    ring.push(c);if(ring.length>5)ring.shift();
    if(voiced){speaking=true;chunks=ring.slice();ring=[];lastVoice=now;startT=now;voicedMs=0;live("🗣 Чувам те...")}
    return;
  }
  chunks.push(c);
  if(voiced){lastVoice=now;voicedMs+=c.length/ctx.sampleRate*1000}
  const dur=now-startT,need=pauseMs()+(dur<1500?300:0);
  if(now-lastVoice>need||dur>30000)finishUtter();
}
async function finishUtter(){
  speaking=false;const ch=chunks;chunks=[];
  if(voicedMs<350){live("🎤 Слушам автоматично...");return}
  sbusy=true;live("⏳ Разпознавам...");
  try{
    const j=await whisper(toWav(ch,ctx.sampleRate));
    const text=(j.text||"").trim();
    if(text.length>1){
      const who=langOf(j.language);
      const f=who?LANGS[SEL[who].value]:["auto","","🌐"];
      const t=who?LANGS[SEL[other(who)].value]:LANGS[SEL.A.value];
      live("⏳ Превеждам...");
      const tr=await translate(text,f[0],t[0]);
      addMsg(who||"B",text,tr,f,t);
      live("🔊");
      await speak(tr,t[0]);
    }
  }catch(e){
    live(e.message==="401"?"⛔ Грешен OpenAI ключ - натисни 🔑.":e.message==="429"?"⛔ Няма кредит или лимитът е изчерпан в OpenAI.":"⚠️ Грешка: "+e.message);
    await sleep(2500);
  }
  await sleep(400);
  if(smartRun){ring=[];speaking=false;sbusy=false;live("🎤 Слушам автоматично...")}
}
async function smartBegin(){
  if(!localStorage.getItem("oaikey")&&!askKey()){$("smart").checked=false;return}
  if(!(await initMic()))return;
  smartRun=true;running=true;sbusy=false;speaking=false;ring=[];chunks=[];
  proc=ctx.createScriptProcessor(4096,1,1);
  proc.onaudioprocess=onAudio;
  msrc.connect(proc);proc.connect(ctx.destination);
  $("go").textContent="⏹";$("go").classList.add("on");
  speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  live("🎤 Слушам автоматично...");
}

async function begin(w){
  if($("smart").checked){await smartBegin();return}
  if(!SR){alert("Този браузър не поддържа разпознаване на реч. Ползвай Chrome или Safari.");return}
  if($("auto").checked&&!(await initMic()))return;
  running=true;busy=false;
  $("go").textContent="⏹";$("go").classList.add("on");
  speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  startRec(w);
}
function pick(w){
  if($("smart").checked)return;
  if(!running){begin(w);return}
  if(busy)return;
  tok++;try{rec.abort()}catch(_){}
  setTimeout(()=>startRec(w),150);
}

if(navigator.standalone)live("ℹ️ От иконата на iPhone гласът не работи. За глас отвори сайта в Safari.");
// ---------- История и профил ----------
const hkey=()=>"hist:"+((window.cloud&&window.cloud.user)?window.cloud.user.uid:"guest");
function getH(k){try{return JSON.parse(localStorage.getItem(k||hkey())||"[]")}catch(_){return[]}}
function setH(a,k){try{localStorage.setItem(k||hkey(),JSON.stringify(a.slice(0,500)))}catch(_){}}
function saveHist(w,o,r,f,t){
  const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now(),w:w,
    fc:f[0],ff:f[2],fn:f[1]||"",tc:t[0],tf:t[2],tn:t[1]||"",o:o,r:r};
  const a=getH();a.unshift(it);setH(a);
  if(window.cloud&&window.cloud.user)window.cloud.save(it).catch(()=>{});
}
function renderH(){
  const q=($("hq").value||"").toLowerCase();
  const a=getH().filter(x=>!q||(x.o+" "+x.r).toLowerCase().includes(q));
  const box=$("hl");box.innerHTML="";
  if(!a.length){box.innerHTML='<div class="hd">Още няма записи.</div>';return}
  let day="";
  a.forEach(x=>{
    const d=new Date(x.t);
    const ds=d.toLocaleDateString("bg-BG",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    if(ds!==day){day=ds;const h=document.createElement("div");h.className="hd";h.textContent=ds;box.appendChild(h)}
    const e=document.createElement("div");e.className="hi";
    e.innerHTML='<div class="o"></div><div class="t"></div><button>🔊</button><button>📋</button><button>🗑</button>';
    e.children[0].textContent=d.toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"})+" · "+x.ff+" "+x.o;
    e.children[1].textContent=x.tf+" "+x.r;
    e.children[2].onclick=()=>speak(x.r,x.tc);
    e.children[3].onclick=()=>{try{navigator.clipboard.writeText(x.r)}catch(_){}};
    e.children[4].onclick=()=>{
      setH(getH().filter(y=>y.id!==x.id));
      if(window.cloud&&window.cloud.user)window.cloud.del(x.id).catch(()=>{});
      renderH();
    };
    box.appendChild(e);
  });
}
$("hist").onclick=()=>{$("ov").classList.add("on");renderH()};

function authUI(){

async function syncCloud(){
  const c=window.cloud;
  if(!(c&&c.user))return;
  $("hst").textContent="☁️ Синхронизирам...";
  try{
    const g=getH("hist:guest"),remote=await c.all();
    for(const it of g)await c.save(it);
    setH([],"hist:guest");
    const m=new Map();
    [...remote,...g,...getH()].forEach(x=>m.set(x.id,x));
    setH([...m.values()].sort((a,b)=>b.t-a.t));
    $("hst").textContent="☁️ Синхронизирано";
  }catch(e){$("hst").textContent="⚠️ Облакът не отговаря"}
  renderH();
}
window.addEventListener("cloudauth",()=>{authUI();if(window.cloud&&window.cloud.user)$("lg").classList.remove("on");syncCloud()});
const ERR={
  "auth/invalid-email":"Невалиден имейл.",
  "auth/missing-password":"Въведи парола.",

  "auth/user-not-found":"Няма профил с този имейл.",
  "auth/wrong-password":"Грешна парола.",
  "auth/popup-closed-by-user":"Прозорецът беше затворен.",

<script type="module">
const cfg=window.FIREBASE_CONFIG;
if(cfg&&cfg.apiKey){
  try{
    const V="https://www.gstatic.com/firebasejs/10.12.2/";
    const {initializeApp}=await import(V+"firebase-app.js");
    const A=await import(V+"firebase-auth.js");
    const F=await import(V+"firebase-firestore.js");
    const app=initializeApp(cfg),auth=A.getAuth(app),db=F.getFirestore(app);
    let user=null;
    const col=()=>F.collection(db,"users",user.uid,"history");
    window.cloud={
      ok:true,
      get user(){return user},
      signInGoogle:async()=>{
        const p=new A.GoogleAuthProvider();
        try{return await A.signInWithPopup(auth,p)}
        catch(e){
          if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported"].includes(e.code))return A.signInWithRedirect(auth,p);
          throw e;
        }
      },
      emailIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
      emailUp:(e,p)=>A.createUserWithEmailAndPassword(auth,e,p),
      reset:e=>A.sendPasswordResetEmail(auth,e),
      signOut:()=>A.signOut(auth),
      save:async it=>{if(user)await F.setDoc(F.doc(db,"users",user.uid,"history",it.id),it)},
      del:async id=>{if(user)await F.deleteDoc(F.doc(db,"users",user.uid,"history",id))},
      all:async()=>{
        if(!user)return[];
        const s=await F.getDocs(F.query(col(),F.orderBy("t","desc"),F.limit(1000)));
        return s.docs.map(d=>d.data());
      },
      clear:async()=>{
        if(!user)return;
        for(;;){
          const s=await F.getDocs(F.query(col(),F.limit(400)));
          if(s.empty)break;
          const b=F.writeBatch(db);s.docs.forEach(d=>b.delete(d.ref));await b.commit();
        }
      }
    };
    A.getRedirectResult(auth).catch(()=>{});
    A.onAuthStateChanged(auth,u=>{user=u;window.dispatchEvent(new Event("cloudauth"))});
  }catch(e){
    console.error(e);
    window.cloud={ok:false};
    window.dispatchEvent(new Event("cloudauth"));
  }
}
</script>
